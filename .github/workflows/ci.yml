name: ci
on:
  push:
    paths: ["edgecast/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["edgecast/**", ".github/workflows/ci.yml"]
defaults:
  run:
    working-directory: edgecast
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          uv venv -p 3.12
          uv pip install -e ".[live]" hypothesis mypy pytest pytest-asyncio pytest-cov respx ruff types-pyyaml
      - name: Lint
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Types (strict on strategy/ and risk.py)
        run: .venv/bin/mypy app/strategy app/risk.py
      - name: Tests + coverage gate
        run: |
          .venv/bin/pytest --cov=app --cov-report=term-missing
          .venv/bin/python scripts/coverage_gate.py
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edgecast:ci .
        working-directory: edgecast
