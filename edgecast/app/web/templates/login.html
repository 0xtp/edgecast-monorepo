{% from "_icons.html" import icon, logo %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edgecast · Sign in</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="grid min-h-screen place-items-center bg-gray-50 px-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex items-center justify-center gap-2.5 text-brand-900">{{ logo("h-9 w-9") }}<span class="text-2xl font-extrabold tracking-tight">EDGECAST</span></div>
    <form method="post" action="/login" class="card space-y-4 p-6">
      <div><h1 class="text-lg font-semibold text-gray-900">Sign in</h1><p class="text-sm text-gray-500">Forecast Desk dashboard</p></div>
      {% if not configured %}
      <p class="rounded-lg bg-amber-50 p-3 text-sm text-amber-800 ring-1 ring-inset ring-amber-200">UI_PASSWORD_HASH is not set. Generate one with <code>python -m app.tools.hash_password</code>.</p>
      {% endif %}
      {% if error %}<p class="rounded-lg bg-red-50 p-3 text-sm text-red-700 ring-1 ring-inset ring-red-200">{{ error }}</p>{% endif %}
      <label class="block"><span class="label">Username</span><input name="username" class="input" autocomplete="username" required></label>
      <label class="block"><span class="label">Password</span><input name="password" type="password" class="input" autocomplete="current-password" required></label>
      <button class="btn btn-primary w-full">{{ icon("lock", "h-4 w-4") }} Sign in</button>
    </form>
  </div>
</body>
</html>
