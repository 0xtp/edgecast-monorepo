[project]
name = "edgecast"
version = "0.1.0"
description = "Polymarket forecast-edge bot and dashboard (weather first, CPI optional)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "bcrypt>=4.1,<5",
  "cryptography>=42",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-multipart>=0.0.9",
  "python-telegram-bot>=21,<23",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0.30,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Only needed for LIVE trading and the wallet scripts. SCAN and PAPER run without it.
live = ["polymarket-client==0.13.0", "eth-account>=0.13,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "backtest"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF059"]
"scripts/**" = ["S"]
"backtest/runner.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.strategy.*", "app.risk"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["integration: end-to-end tests against recorded fixtures"]

[tool.coverage.run]
source = ["app"]
branch = true
